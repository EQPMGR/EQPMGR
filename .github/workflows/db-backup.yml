# Nightly backup of the shared Supabase database (rider app + shop app).
# The free Supabase plan has no restorable backups, so this keeps 30 days of
# encrypted dumps as GitHub Actions artifacts (Actions tab -> this workflow -> a run).
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL     Supabase -> Connect -> "Session pooler" connection string, with the DB password filled in
#   BACKUP_PASSPHRASE   a long passphrase; keep a copy in your password manager, or the backups can't be opened
# Restore steps: docs/RESTORE.md
name: Nightly database backup

on:
  schedule:
    - cron: '30 10 * * *'   # 03:30 Vancouver (summer time), 02:30 in winter
  workflow_dispatch:         # "Run workflow" button for a backup on demand

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump roles, schema and data
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" || { echo "SUPABASE_DB_URL secret is missing"; exit 1; }
          supabase db dump --db-url "$DB_URL" -f roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f schema.sql
          supabase db dump --db-url "$DB_URL" -f data.sql --use-copy --data-only

      - name: Compress and encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$PASSPHRASE" || { echo "BACKUP_PASSPHRASE secret is missing"; exit 1; }
          stamp=$(date -u +%Y-%m-%d)
          tar -czf backup.tar.gz roles.sql schema.sql data.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "eqpmgr-db-$stamp.tar.gz.gpg" backup.tar.gz
          rm -f roles.sql schema.sql data.sql backup.tar.gz
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          ls -la eqpmgr-db-*.gpg

      - uses: actions/upload-artifact@v4
        with:
          name: eqpmgr-db-${{ env.STAMP }}
          path: eqpmgr-db-*.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
